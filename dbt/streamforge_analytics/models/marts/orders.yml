version: 2

models:
  - name: orders
    description: Order overview data mart with one row per order.

    columns:
      - name: order_id
        description: The unique key for each order.
        data_tests:
          - not_null
          - unique

      - name: customer_id
        description: The customer who placed the order.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id

      - name: order_number
        description: The business reference number for the order.

      - name: order_status
        description: The current status of the order.

      - name: total_amount
        description: The total amount recorded for the order.

      - name: currency
        description: The currency used for the order amount.

      - name: shipping_city
        description: The city where the order is shipped.

      - name: created_at
        description: The timestamp when the order was created.

      - name: updated_at
        description: The timestamp when the order was last updated.

      - name: order_date
        description: The date when the order was created.

      - name: item_count
        description: The number of distinct order items in the order.

      - name: total_units
        description: The total number of product units in the order.

      - name: items_revenue
        description: Revenue calculated from order item quantity multiplied by item price.

      - name: customer_order_number
        description: The sequential order number for the customer, based on order date.