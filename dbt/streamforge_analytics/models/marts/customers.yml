version: 2

models:
  - name: customers
    description: Customer overview data mart with one row per customer.

    columns:
      - name: customer_id
        description: The unique key for each customer.
        data_tests:
          - not_null
          - unique

      - name: first_name
        description: The customer's first name.

      - name: last_name
        description: The customer's last name.

      - name: email
        description: The customer's email address.

      - name: phone
        description: The customer's phone number.

      - name: city
        description: The customer's city.

      - name: postal_code
        description: The customer's postal code.

      - name: country
        description: The customer's country.

      - name: customer_segment
        description: The customer segment stored in the transactional database.

      - name: lifetime_orders
        description: Total number of orders placed by the customer.

      - name: first_order_date
        description: The date of the customer's first order.

      - name: last_order_date
        description: The date of the customer's most recent order.

      - name: lifetime_spend
        description: Total amount spent by the customer across all orders.

      - name: customer_type
        description: Customer classification based on order history.
        data_tests:
          - accepted_values:
              arguments:
                values: ["new", "returning", "no_orders"]