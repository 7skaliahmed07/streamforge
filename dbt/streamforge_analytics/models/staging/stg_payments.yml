version: 2

models:
  - name: stg_payments
    description: Payment data from the Silver layer, one row per payment.

    columns:
      - name: payment_id
        description: Unique identifier for each payment.
        data_tests:
          - not_null
          - unique

      - name: order_id
        description: Order associated with the payment.
        data_tests:
          - not_null

      - name: payment_status
        description: Current payment status.

      - name: payment_method
        description: Payment method used.

      - name: amount
        description: Payment amount.

      - name: created_at
        description: Payment creation timestamp.
