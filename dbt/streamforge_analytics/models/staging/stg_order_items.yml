version: 2

models:
  - name: stg_order_items
    description: Order item data with basic cleaning and transformation applied, one row per order item.

    columns:
      - name: order_item_id
        description: The unique key for each order item.
        data_tests:
          - not_null
          - unique

      - name: order_id
        description: The order associated with this item.
        data_tests:
          - not_null

      - name: product_id
        description: The product associated with this item.
        data_tests:
          - not_null

      - name: quantity
        description: The number of units purchased.
        data_tests:
          - not_null

      - name: item_price
        description: The price recorded for this order item.
        data_tests:
          - not_null