version: 2

sources:
  - name: streamforge
    schema: public
    database: streamforge
    description: StreamForge retail transactional database.

    tables:
      - name: customers
        description: One record per customer.

      - name: products
        description: One record per product.

      - name: orders
        description: One record per customer order.

      - name: order_items
        description: One record per product item within an order.

      - name: inventory
        description: Current inventory information for products.

      - name: payments
        description: Payment information associated with orders.