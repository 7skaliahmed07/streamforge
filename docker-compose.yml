services:

  postgres:
    image: postgres:16
    container_name: streamforge-postgres
    restart: always

    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: streamforge

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data


  kafka:
    image: apache/kafka:4.1.0
    container_name: streamforge-kafka
    restart: always

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_LISTENERS: CONTROLLER://:9093,PLAINTEXT://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://streamforge-kafka:9092

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@streamforge-kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

    ports:
      - "9092:9092"


  kafka-connect:
    image: quay.io/debezium/connect:3.3
    container_name: streamforge-kafka-connect
    restart: always

    depends_on:
      - kafka
      - postgres

    environment:
      BOOTSTRAP_SERVERS: streamforge-kafka:9092

      GROUP_ID: streamforge-connect

      CONFIG_STORAGE_TOPIC: streamforge_connect_configs
      OFFSET_STORAGE_TOPIC: streamforge_connect_offsets
      STATUS_STORAGE_TOPIC: streamforge_connect_status

      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1

      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter

      KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      VALUE_CONVERTER_SCHEMAS_ENABLE: "false"

      REST_ADVERTISED_HOST_NAME: streamforge-kafka-connect

    ports:
      - "8083:8083"


  spark:
    image: streamforge-spark:4.1.4
    container_name: streamforge-spark
    restart: unless-stopped

    depends_on:
      - kafka

    working_dir: /opt/spark-apps

    entrypoint:
      - /bin/bash
      - -lc
      - sleep infinity

    volumes:
      - ./streaming/spark/jobs:/opt/spark-apps/jobs:ro
      - spark_checkpoints:/opt/spark-apps/checkpoints


volumes:

  postgres_data:
  spark_checkpoints:

